<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schreiblernspiel — Bachbrücke</title>
  </head>
  <body>
    <div id="wrap">
      <nav id="top-nav">
        <strong>Schreiblernspiel</strong>
        <a href="./index.html">Spielen</a>
        <a href="./editor.html">Editor</a>
      </nav>
      <div id="game"></div>
    </div>
    <div id="hud">
      <div id="pads">
        <button type="button" id="pad-left" aria-label="Links">◀</button>
        <button type="button" id="pad-right" aria-label="Rechts">▶</button>
      </div>
      <div id="pads-right">
        <button type="button" id="pad-transform" aria-label="Verwandeln">
          <span class="pad-icon" aria-hidden="true">
            <img
              id="pad-transform-img"
              class="pad-transform-img"
              src="/art/bolt_vehicle_side.png"
              alt=""
              decoding="async"
            />
          </span>
          <span class="pad-label" id="pad-transform-label">Auto</span>
        </button>
        <button type="button" id="pad-jump" aria-label="Springen">
          <span class="pad-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="40" height="40">
              <path d="M12 48c8-2 14-14 20-14s10 8 20 12" fill="none" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
              <path d="M32 10v22M32 10l-10 10M32 10l10 10" fill="none" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="pad-label">Sprung</span>
        </button>
      </div>
    </div>
    <div id="goal-banner" class="hidden">Ziel erreicht!</div>
    <div id="ballkanone-overlay" class="hidden">
      <div id="ballkanone-chrome">
        <button type="button" id="ballkanone-hear">Wort hören</button>
        <p id="ballkanone-prompt"></p>
        <p id="ballkanone-slots" aria-live="polite"></p>
        <p id="ballkanone-misses" aria-live="polite">Fehlversuche: 0</p>
        <p id="ballkanone-feedback" aria-live="polite"></p>
      </div>
      <canvas id="ballkanone-canvas"></canvas>
      <div id="ballkanone-success" class="hidden" role="dialog" aria-label="Erfolg">
        <p class="success-title">Super!</p>
        <div id="ballkanone-stars" class="success-stars"></div>
        <button type="button" id="ballkanone-continue">Weiter</button>
      </div>
    </div>
    <div id="puzzle-overlay" class="hidden">
      <div id="puzzle-panel">
        <button type="button" id="puzzle-hear">Wort hören</button>
        <div id="puzzle-motif"></div>
        <p id="puzzle-prompt"></p>
        <div id="puzzle-text-row">
          <input id="puzzle-input" autocomplete="off" autocapitalize="off" />
          <div id="puzzle-letter-slots" class="hidden" aria-label="Buchstabenfelder">
            <div class="letter-trio" data-trio="0">
              <input class="letter-slot-input" data-slot="0" maxlength="1" autocomplete="off" autocapitalize="off" inputmode="text" />
              <input class="letter-slot-input letter-slot-mid" data-slot="1" maxlength="1" autocomplete="off" autocapitalize="off" inputmode="text" />
              <input class="letter-slot-input" data-slot="2" maxlength="1" autocomplete="off" autocapitalize="off" inputmode="text" />
            </div>
            <div class="letter-trio" data-trio="1">
              <input class="letter-slot-input" data-slot="3" maxlength="1" autocomplete="off" autocapitalize="off" inputmode="text" />
              <input class="letter-slot-input letter-slot-mid" data-slot="4" maxlength="1" autocomplete="off" autocapitalize="off" inputmode="text" />
              <input class="letter-slot-input" data-slot="5" maxlength="1" autocomplete="off" autocapitalize="off" inputmode="text" />
            </div>
          </div>
        </div>
        <canvas id="puzzle-trace" class="hidden" width="400" height="240"></canvas>
        <div id="puzzle-hints" class="hidden" aria-live="polite"></div>
        <p id="puzzle-error"></p>
        <button type="button" id="puzzle-ok">Fertig</button>
      </div>
      <div id="puzzle-anlaut" class="hidden" aria-label="Schreibtabelle"></div>
      <div id="puzzle-success" class="hidden" role="dialog" aria-labelledby="success-title">
        <div class="success-burst" aria-hidden="true"></div>
        <p id="success-title" class="success-title">Super!</p>
        <div id="success-stars" class="success-stars" aria-live="polite"></div>
        <p id="success-sub" class="success-sub"></p>
        <button type="button" id="success-continue">Weiter</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
